name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: evalimport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle: '4.1', branch: MOODLE_401_STABLE, php: '7.4', database: mariadb, behat: false}
          - {moodle: '4.2', branch: MOODLE_402_STABLE, php: '8.1', database: mariadb, behat: false}
          - {moodle: '4.3', branch: MOODLE_403_STABLE, php: '8.1', database: mariadb, behat: false}
          - {moodle: '4.4', branch: MOODLE_404_STABLE, php: '8.1', database: mariadb, behat: false}
          - {moodle: '4.5', branch: MOODLE_405_STABLE, php: '8.1', database: mariadb, behat: true}
          - {moodle: '5.0', branch: MOODLE_500_STABLE, php: '8.2', database: pgsql, behat: false}
          - {moodle: '5.1', branch: MOODLE_501_STABLE, php: '8.3', database: mariadb, behat: false}
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.3', database: pgsql, behat: false}
          # 5.3 beta is currently on main. Switch these entries to MOODLE_503_STABLE once it exists.
          - {moodle: '5.3-beta', branch: main, php: '8.3', database: mariadb, behat: true}
          - {moodle: '5.3-beta', branch: main, php: '8.4', database: pgsql, behat: true}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: moodle
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, iconv, intl, mbstring, mysqli, pdo_mysql, pgsql, pdo_pgsql, simplexml, soap, sodium, xml, xmlreader, xmlwriter, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI tooling
        run: |
          composer create-project --no-dev --prefer-dist --no-interaction moodlehq/moodle-plugin-ci ci ^4
          echo "${GITHUB_WORKSPACE}/ci/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle test environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          DB_USER: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
          DB_PASS: ${{ matrix.database == 'pgsql' && 'postgres' || 'moodle' }}
          MOODLE_BRANCH: ${{ matrix.branch }}
      - name: PHP syntax
        run: moodle-plugin-ci phplint
      - name: Coding standards
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: PHP documentation
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Plugin validation
        run: moodle-plugin-ci validate
      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat
        id: behat
        if: ${{ matrix.behat }}
        run: moodle-plugin-ci behat --profile chrome
      - name: Upload browser failure evidence
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: behat-${{ matrix.moodle }}-php${{ matrix.php }}-${{ matrix.database }}
          path: |
            moodledata/behat_dump
            moodledata/behatrun
          retention-days: 7
          if-no-files-found: ignore
